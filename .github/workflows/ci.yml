name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # 测试用：pytest + 本地中继用的 websockets
          python -m pip install pytest websockets

      - name: Tests
        run: python -m pytest -q

      # 回归防线：远程互联的加密层必须和 Python 端字节级一致。
      # 这个脚本会联网取标准实现的输出做比对，CI 里允许（不花用户流量）。
      - name: Cross-implementation vectors
        run: python tools/gen_cross_vectors.py

      # 端到端冒烟：中继 + PC 端 + 模拟手机，走真实 WS 与真实加密
      - name: Relay end-to-end smoke
        run: |
          python -m pytest tests/test_relay_e2e.py tests/test_phone_cli.py -q

  # 打包检查：PyInstaller 能产出 exe 才算没坏
  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build (PyInstaller)
        run: .\build.bat
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MollyPaw-windows
          path: dist/MollyPaw.exe
          if-no-files-found: error
