name: release

# 打 tag 就发版：v0.0.0.1.6 -> 跑测试 -> 校验版本 -> 构建 -> 建 GitHub Release。
# 手动触发（workflow_dispatch）只构建校验，不发布。
#
# 版本号的**唯一真源是 tag**。代码里不再维护一份"当前版本"，
# 所以不会出现「README 写 0.1.5、实际打包出 0.1.4」这种漂移。
on:
  push:
    tags: ["beta-*", "Beta-*"]
  workflow_dispatch:

permissions:
  contents: write   # 建 GitHub Release 需要

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest websockets
      - name: Tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 版本号 / CHANGELOG 一致性校验
      - name: Verify release metadata
        run: python tools/release_check.py "$RELEASE_TAG"

      - name: Build
        run: .\build.bat

      - name: Prepare release notes
        if: github.ref_type == 'tag'
        run: python tools/release_notes.py "$RELEASE_TAG" > release-notes.md && cat release-notes.md

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "MollyPaw ${RELEASE_TAG#v}" \
            --notes-file release-notes.md \
            dist/MollyPaw.exe || echo "Release 已存在，跳过"
