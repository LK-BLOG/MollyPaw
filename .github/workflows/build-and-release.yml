name: build-and-release

# 打 tag 自动发版：beta-0.0.0.2.0 -> 跑测试 -> 打包 -> 建 GitHub Release
#
# 版本号唯一真源是 tag。CI 里也跑一次，方便 PR 阶段就发现构建坏了。
on:
  push:
    branches: ["main"]
    tags: ["beta-*", "Beta-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: MollyPaw
      # 中继仓库也要 —— 主仓库的 relay 测试要用它的 relay/dev_server.py
      - uses: actions/checkout@v4
        with:
          repository: LK-BLOG/MollyPaw-Relay
          path: MollyPaw-Relay
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pywebview 在 Linux 上 import 时就要连 X display，
      # 没有就会 Xlib.error.DisplayNameError: Bad display name ""。
      # 光 export DISPLAY 没用 —— 那个屏得真有人起，所以走 xvfb-run。
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Install
        working-directory: MollyPaw
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest websockets
      - name: Tests
        working-directory: MollyPaw
        shell: bash
        # 排除联网测试（要访问 api.qrserver.com 拿标准 QR 比对，
        # runner 到那个站不一定通，不通不该让发版流程红）
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1280x1024x24" \
              python -m pytest -q -m "not network"
          else
            python -m pytest -q -m "not network"
          fi

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: MollyPaw
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: MollyPaw
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply version from tag
        working-directory: MollyPaw
        shell: bash
        run: |
          # 版本号唯一真源是 tag，写进 agent/version.py 让自动更新能比大小。
          # 非 tag 的 main 构建只是验证能打包，**不写版本号** ——
          # 以前这里无参数调用 apply_version.py，main push 直接以
          # "拿不到有效版本号（tag=''）" 退出 1，于是每次推 main 都红一片。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python tools/apply_version.py "${GITHUB_REF_NAME}"
          else
            echo "非 tag 构建，沿用仓库里的版本号：$(python -c 'from agent.version import APP_VERSION; print(APP_VERSION)')"
          fi
      - name: Build
        working-directory: MollyPaw
        run: .\build.bat
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MollyPaw-windows
          path: MollyPaw/dist/MollyPaw.exe
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: MollyPaw
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare release notes
        working-directory: MollyPaw
        run: python tools/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          name: MollyPaw-windows
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 必须显式带 --repo：checkout 把仓库放在 MollyPaw/ 子目录，
          # 这一步在 workspace 根执行，gh 会报 "not a git repository"。
          # 之前那句 || echo "Release 已存在，跳过" 把这个错误也一起吞了，
          # 于是"CI 绿了但 Release 没建出来"。
          REPO="${GITHUB_REPOSITORY}"
          # tag 可能带 beta-/Beta- 前缀，标题只用纯版本号
          VERSION=$(python -c "import re,sys; m=re.search(r'(\\d[\\d.]*)$', sys.argv[1]); print(m.group(1) if m else sys.argv[1])" "${GITHUB_REF_NAME}")
          if gh release view "${GITHUB_REF_NAME}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --repo "${REPO}" \
              --title "MollyPaw ${VERSION}" \
              --notes-file MollyPaw/release-notes.md
            gh release upload "${GITHUB_REF_NAME}" --repo "${REPO}" dist/MollyPaw.exe --clobber
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${REPO}" \
              --title "MollyPaw ${VERSION}" \
              --notes-file MollyPaw/release-notes.md \
              dist/MollyPaw.exe
          fi
