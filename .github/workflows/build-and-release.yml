name: build-and-release

# 打 tag 自动发版：v0.0.0.1.6 -> 跑测试 -> 打包 -> 建 GitHub Release
#
# 版本号唯一真源是 tag。CI 里也跑一次，方便 PR 阶段就发现构建坏了。
on:
  push:
    branches: ["main"]
    tags: ["beta-*", "Beta-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest websockets
      - name: Tests
        run: python -m pytest -q

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build
        run: .\build.bat
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MollyPaw-windows
          path: dist/MollyPaw.exe
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare release notes
        run: python tools/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          name: MollyPaw-windows
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "MollyPaw ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            dist/MollyPaw.exe || echo "Release 已存在，跳过"
