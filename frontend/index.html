<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MollyPaw</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo-area">
        <svg role="img" aria-label="MollyPaw logo" class="logo-img" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><ellipse cx="100" cy="125" rx="38" ry="32" fill="#8B5E3C"/><ellipse cx="65" cy="75" rx="16" ry="18" fill="#A06E46"/><ellipse cx="100" cy="60" rx="16" ry="18" fill="#A06E46"/><ellipse cx="135" cy="75" rx="16" ry="18" fill="#A06E46"/></svg>
        <span class="logo-text">MollyPaw</span>
      </div>
      <div class="sidebar-actions">
        <button id="lang-toggle" class="icon-btn lang-btn" title="Switch Language">EN</button>
        <button id="new-chat-btn" class="icon-btn" data-i18n="new_chat" data-i18n-attr="title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
    <div class="sidebar-content">
      <div class="chat-history" id="chat-history">
        <div class="history-empty" data-i18n="no_conversations">No conversations yet</div>
      </div>
    </div>
    <div class="sidebar-footer">
      <button id="settings-btn" class="sidebar-action-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span data-i18n="settings">Settings</span>
      </button>
    </div>
  </aside>

  <!-- main chat area -->
  <main id="main">
    <div class="chat-container" id="chat-container">
      <!-- welcome -->
      <div class="welcome-screen" id="welcome-screen">
        <svg role="img" aria-label="MollyPaw logo" class="welcome-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><ellipse cx="100" cy="125" rx="38" ry="32" fill="#8B5E3C"/><ellipse cx="65" cy="75" rx="16" ry="18" fill="#A06E46"/><ellipse cx="100" cy="60" rx="16" ry="18" fill="#A06E46"/><ellipse cx="135" cy="75" rx="16" ry="18" fill="#A06E46"/></svg>
        <h1 data-i18n="welcome_title">Hello, I'm MollyPaw!</h1>
        <p class="welcome-sub" data-i18n="welcome_sub">Your AI, right at your paw.</p>
        <div class="welcome-prompts">
          <button class="prompt-chip" data-prompt="Help me write a Python script to sort files by extension" data-i18n-prompt="chip_prompt1">
            <span class="prompt-icon">&#128221;</span>
            <span data-i18n="chip1">Write a Python script</span>
          </button>
          <button class="prompt-chip" data-prompt="Explain how PyWebView works under the hood" data-i18n-prompt="chip_prompt2">
            <span class="prompt-icon">&#128161;</span>
            <span data-i18n="chip2">Explain PyWebView</span>
          </button>
          <button class="prompt-chip" data-prompt="What can you do as an AI agent?" data-i18n-prompt="chip_prompt3">
            <span class="prompt-icon">&#129302;</span>
            <span data-i18n="chip3">What can you do?</span>
          </button>
        </div>
      </div>

      <!-- messages -->
      <div class="messages" id="messages"></div>
    </div>

    <!-- input area -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="user-input" data-i18n="input_placeholder" data-i18n-attr="placeholder" placeholder="Ask MollyPaw anything..." rows="1"></textarea>
        <button id="send-btn" class="send-btn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <p class="input-hint" data-i18n="hint">MollyPaw Beta 0.0.0.1.1</p>
    </div>
  </main>

  <!-- settings panel -->
  <div class="modal-overlay" id="settings-modal" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2 data-i18n="settings_title">Settings</h2>
        <button id="settings-close" class="icon-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="cfg-api-key" data-i18n="api_key_label">API Key</label>
          <input type="password" id="cfg-api-key" placeholder="sk-...">
        </div>
        <div class="form-group">
          <label for="cfg-base-url" data-i18n="base_url_label">Base URL</label>
          <input type="text" id="cfg-base-url" placeholder="https://api.openai.com/v1">
        </div>
        <div class="form-group">
          <label for="cfg-model" data-i18n="model_label">Model</label>
          <input type="text" id="cfg-model" placeholder="gpt-3.5-turbo">
        </div>
        <div class="form-group">
          <label for="cfg-temperature" data-i18n="temp_label">Temperature</label>
          <input type="number" id="cfg-temperature" min="0" max="2" step="0.1" placeholder="0.7">
        </div>
        <div class="form-group">
          <label for="cfg-approval-mode" data-i18n="approval_mode_label">Tool Approval Mode</label>
          <select id="cfg-approval-mode">
            <option value="prompt_all" data-i18n="approval_all">Prompt for all tools</option>
            <option value="prompt_dangerous" selected data-i18n="approval_dangerous">Prompt dangerous only</option>
            <option value="full_access" data-i18n="approval_full">Full access (no prompts)</option>
          </select>
        </div>
        <div class="form-actions">
          <button id="cfg-save" class="btn-primary" data-i18n="save">Save</button>
          <button id="cfg-cancel" class="btn-secondary" data-i18n="cancel">Cancel</button>
        </div>
        <div id="cfg-status" class="cfg-status"></div>
      </div>
    </div>
  </div>

  <!-- Approval Modal -->
  <div class="approval-overlay" id="approval-overlay" style="display:none;">
    <div class="approval-modal">
      <div class="approval-header">
        <span class="approval-icon">&#9888;&#65039;</span>
        <h3 data-i18n="approval_title">Approval Required</h3>
      </div>
      <div class="approval-body">
        <div class="approval-detail">
          <span class="approval-label" data-i18n="approval_tool">Tool</span>
          <span id="approval-tool-name"></span>
        </div>
        <div class="approval-detail">
          <span class="approval-label" data-i18n="approval_args">Arguments</span>
          <pre id="approval-args"></pre>
        </div>
        <div class="approval-detail">
          <span class="approval-label" data-i18n="approval_danger">Danger Level</span>
          <span id="approval-danger" class="danger-badge">dangerous</span>
        </div>
      </div>
      <div class="approval-actions">
        <button id="approval-approve" class="btn-approve" data-i18n="approval_approve">Approve</button>
        <button id="approval-reject" class="btn-reject" data-i18n="approval_reject">Reject</button>
        <label class="approval-always">
          <input type="checkbox" id="approval-always-check"> <span data-i18n="approval_always">Always approve in this session</span>
        </label>
      </div>
    </div>
  </div>

  <script src="marked.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
